kind = "web"
previewPath = "/"
title = "Lead → Launch"
version = "1.0.0"
id = "artifacts/lead-launch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22730

[services.development]
run = "pnpm --filter @workspace/lead-launch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lead-launch", "run", "build" ]
publicDir = "artifacts/lead-launch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22730"
BASE_PATH = "/"
