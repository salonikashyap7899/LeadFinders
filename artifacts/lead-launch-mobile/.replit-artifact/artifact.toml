kind = "mobile"
previewPath = "/mobile/"
title = "Lead → Launch Mobile"
version = "1.0.0"
id = "artifacts/lead-launch-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19370

[services.development]
run = "pnpm --filter @workspace/lead-launch-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lead-launch-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lead-launch-mobile", "run", "serve" ]

[services.env]
PORT = "19370"
BASE_PATH = "/mobile/"
